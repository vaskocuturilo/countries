import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}"
    id 'org.springdoc.openapi-gradle-plugin' version "${openapiPlugin}"
    id 'org.openapi.generator' version "${openapiGenerator}"
}

group = 'com.example'
version = '1.0.0'
description = 'api-countries'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapi}"
    implementation "io.swagger.core.v3:swagger-annotations:${swaggerAnnotation}"
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "com.auth0:java-jwt:${jwtVersion}"
    implementation "org.mapstruct:mapstruct:${mapstruct}"
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:${jakartaXmlBindApi}"


    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstruct}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:kafka'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs.yaml")
    outputDir.set(file("openapi"))
    outputFileName.set("api-countries.yaml")
    waitTimeInSeconds.set(30)

    customBootRun {
        args.add("--spring.profiles.active=dev")
    }
}

/*
──────────────────────────────────────────────────────
============== Open API generation =========
──────────────────────────────────────────────────────
*/

def openApiDir = file("$rootDir/openapi")
def outRoot = layout.buildDirectory.dir("generated-openapi")

def foundSpecifications = openApiDir.listFiles({ f ->
    f.name.endsWith('.yaml') || f.name.endsWith('.yml')
} as FileFilter) ?: []

logger.lifecycle("Found ${foundSpecifications.size()} specifications: " + foundSpecifications.collect { it.name }.join(', '))

def generateTasks = foundSpecifications.collect { specFile ->
    def specName = specFile.name.replaceAll(/\.[^.]+$/, '')

    def taskName = "generate" + specName
            .split(/[^A-Za-z0-9]/)
            .findAll { it }
            .collect { it.capitalize() }
            .join('')

    tasks.register(taskName, GenerateTask) {
        generatorName.set("spring")
        inputSpec.set(specFile.absolutePath)

        outputDir.set(outRoot.get().asFile.absolutePath)

        def base = "com.example.apicountries.${specName.split('-')[0].toLowerCase()}"
        configOptions.set([
                library             : "spring-boot",
                interfaceOnly       : "true",
                useJakartaEe        : "true",
                skipDefaultInterface: "true",
                useBeanValidation   : "true",
                openApiNullable     : "false",
                useFeignClientUrl   : "true",
                useTags             : "true",
                apiPackage          : "${base}.api",
                modelPackage        : "${base}.dto",
                configPackage       : "${base}.config"
        ])
        doFirst {
            logger.lifecycle("${taskName}: starting generation from ${specFile.name}")
        }
    }
}

def generateAllOpenApi = tasks.register("generateAllOpenApi") {
    dependsOn(generateTasks)
    doLast { logger.lifecycle("generateAllOpenApi: all specifications have been generated") }
}

sourceSets {
    main {
        java {
            srcDir outRoot.map { it.dir("src/main/java") }
        }
    }
}

tasks.named("compileJava") {
    dependsOn(generateAllOpenApi)
}

idea {
    module {
        def genDir = outRoot.map { it.dir("src/main/java").asFile }.get()
        generatedSourceDirs += genDir
        sourceDirs += genDir
    }
}


/*
──────────────────────────────────────────────────────
============== NEXUS =============
──────────────────────────────────────────────────────
*/

def envFile = new File("../.env")

if (envFile.exists()) {
    envFile.readLines().each { line ->
        if (line.trim() && line.contains('=') && !line.startsWith('#')) {
            def (k, v) = line.split('=', 2)
            System.setProperty(k.trim(), v.trim())
            logger.lifecycle("${k.trim()}=${v.trim()}")
        }
    }
}

def nexusUrl = System.getenv("NEXUS_URL") ?: System.getProperty("NEXUS_URL")
def nexusUser = System.getenv("NEXUS_USERNAME") ?: System.getProperty("NEXUS_USERNAME")
def nexusPassword = System.getenv("NEXUS_PASSWORD") ?: System.getProperty("NEXUS_PASSWORD")

if (!nexusUrl || !nexusUser || !nexusPassword) {
    throw new GradleException(
            "NEXUS_URL or NEXUS_USER or NEXUS_PASSWORD not set. " +
                    "Please create a .env file with these properties or set environment variables."
    )
}

repositories {
    mavenCentral()
    maven {
        url = uri(nexusUrl)
        allowInsecureProtocol = true
        if (nexusUrl.startsWith("http")) {
            credentials {
                username = nexusUser
                password = nexusPassword
            }
        }
    }
}
